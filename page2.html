<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learn With Me - Will Be In Soon</title>
    <style>
        :root {
            --primary-glow: rgba(0, 242, 254, 0.4);
            --neon-blue: #00f2fe;
            --neon-green: #00ff88;
            --neon-gold: #ffdf00;
            --neon-yellow: #e5b800;
            --amber-glow: rgba(255, 223, 0, 0.3);
            --panel-bg: rgba(10, 12, 18, 0.55);
            --glass-border: rgba(255, 223, 0, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #040d12;
            position: relative;
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 30%, rgba(0,0,0,0.7) 100%);
            pointer-events: none;
            z-index: 2;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 50px 40px;
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7), inset 0 1px 1px rgba(255,255,255,0.05);
            z-index: 10;
            max-width: 550px;
            width: 90%;
        }

        .status-text {
            font-size: 25px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 35px;
            color: var(--neon-gold);
            text-shadow: 0 0 20px rgba(255, 223, 0, 0.6);
            animation: titlePulse 2s ease-in-out infinite alternate;
        }

        @keyframes titlePulse {
            from { text-shadow: 0 0 15px rgba(255, 223, 0, 0.5); transform: scale(1); }
            to { text-shadow: 0 0 25px rgba(255, 223, 0, 0.9); transform: scale(1.02); }
        }

        .countdown-grid {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 40px;
        }

        .time-box {
            background: linear-gradient(135deg, rgba(255,255,255,0.04) 0%, rgba(255,255,255,0.005) 100%);
            border: 1px solid rgba(255,255,255,0.06);
            padding: 20px 10px;
            border-radius: 20px;
            min-width: 90px;
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.05);
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        .time-box:hover {
            transform: translateY(-8px);
            border-color: var(--neon-blue);
            box-shadow: 0 12px 24px var(--primary-glow);
        }

        .time-box span {
            display: block;
        }

        .number {
            font-size: 38px;
            font-weight: 800;
            color: var(--neon-blue);
            text-shadow: 0 0 12px var(--primary-glow);
            font-variant-numeric: tabular-nums;
        }

        .label {
            font-size: 11px;
            text-transform: uppercase;
            color: #8a8a9e;
            margin-top: 6px;
            letter-spacing: 1.5px;
            font-weight: 600;
        }

        .back-btn {
            display: inline-block;
            color: #8a8a9e;
            text-decoration: none;
            font-size: 14px;
            transition: all 0.3s ease;
            border-bottom: 1px dashed rgba(138, 138, 158, 0.4);
            padding-bottom: 2px;
        }

        .back-btn:hover {
            color: #ffffff;
            border-bottom-color: #ffffff;
            text-shadow: 0 0 8px rgba(255,255,255,0.6);
        }

        .audio-interaction-overlay {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(5, 5, 10, 0.4);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 99999;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: opacity 0.6s ease, visibility 0.6s;
        }

        .interaction-prompt {
            font-family: monospace;
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--neon-gold);
            letter-spacing: 3px;
            text-shadow: 0 0 15px var(--amber-glow);
            animation: textPulse 1.5s infinite alternate;
        }

        .global-screen-glow {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9999;
            box-shadow: 
                inset 0 0 40px rgba(255, 223, 0, 0.2),
                inset 0 0 80px rgba(229, 184, 0, 0.1);
            animation: atmosphericPulse 3.5s ease-in-out infinite alternate;
        }

        .audio-player-widget {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            padding: 12px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            z-index: 10000;
            transform: perspective(800px) rotateX(10deg) rotateY(-10deg);
            transform-style: preserve-3d;
            box-shadow: 
                -5px 5px 15px rgba(0, 0, 0, 0.6),
                0 0 30px rgba(255, 223, 0, 0.05),
                inset 0 1px 2px rgba(255, 255, 255, 0.1);
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .audio-player-widget:hover {
            background: rgba(20, 18, 12, 0.7);
            transform: perspective(800px) rotateX(0deg) rotateY(0deg) translateY(-5px);
            box-shadow: 
                0 15px 35px rgba(0, 0, 0, 0.6),
                0 0 40px rgba(255, 223, 0, 0.25),
                inset 0 1px 2px rgba(255, 255, 255, 0.15);
        }

        .visualizer-container {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 14px;
            border: 1px solid rgba(255, 223, 0, 0.1);
            transform: translateZ(15px);
            overflow: hidden;
        }

        .glow-orb {
            position: absolute;
            width: 120%;
            height: 120%;
            background: radial-gradient(circle, rgba(255,223,0,0.3) 0%, rgba(229,184,0,0) 70%);
            opacity: 1;
            mix-blend-mode: screen;
            animation: pulseGlow 3s infinite alternate;
        }

        .vfx-bars {
            display: flex;
            align-items: flex-end;
            gap: 3px;
            height: 20px;
            z-index: 2;
        }

        .bar3d {
            width: 3px;
            height: 30%;
            background: linear-gradient(to top, var(--neon-yellow), var(--neon-gold));
            border-radius: 2px;
            transform-origin: bottom;
            box-shadow: 0 0 8px var(--neon-gold);
            animation: vfxBounce 0.6s ease-in-out infinite alternate;
        }

        .bar3d:nth-child(1) { animation-delay: 0.1s; height: 75%; }
        .bar3d:nth-child(2) { animation-delay: 0.35s; height: 90%; }
        .bar3d:nth-child(3) { animation-delay: 0.2s; height: 60%; }
        .bar3d:nth-child(4) { animation-delay: 0.5s; height: 100%; }
        .bar3d:nth-child(5) { animation-delay: 0.15s; height: 40%; }

        @keyframes atmosphericPulse {
            0% {
                box-shadow: 
                    inset 0 0 30px rgba(255, 223, 0, 0.2),
                    inset 0 0 60px rgba(229, 184, 0, 0.1);
            }
            100% {
                box-shadow: 
                    inset 0 0 60px rgba(255, 223, 0, 0.45),
                    inset 0 0 120px rgba(229, 184, 0, 0.25);
            }
        }

        @keyframes textPulse {
            from { opacity: 0.4; text-shadow: 0 0 5px var(--amber-glow); }
            to { opacity: 1; text-shadow: 0 0 20px var(--neon-gold); }
        }

        @keyframes vfxBounce {
            0% { transform: scaleY(0.25); filter: brightness(0.9); }
            100% { transform: scaleY(1.1); filter: brightness(1.2); }
        }

        @keyframes pulseGlow {
            0% { transform: scale(1) rotate(0deg); }
            100% { transform: scale(1.3) rotate(180deg); }
        }
    </style>
</head>
<body>

    <canvas id="plexusCanvas"></canvas>
    <div class="overlay"></div>
    <div class="global-screen-glow"></div>

    <div id="audio-click-overlay" class="audio-interaction-overlay">
        <div class="interaction-prompt">⚡ TAP ANYWHERE FOR SYSTEM ACTIVATION ⚡</div>
    </div>

    <div class="audio-player-widget">
        <div class="visualizer-container playing" id="visualizer">
            <div class="glow-orb"></div>
            <div class="vfx-bars">
                <span class="bar3d"></span>
                <span class="bar3d"></span>
                <span class="bar3d"></span>
                <span class="bar3d"></span>
                <span class="bar3d"></span>
            </div>
        </div>
    </div>

    <audio id="bg-music" loop autoplay muted>
        <source src="https://actions.google.com/sounds/v1/ambiences/space_ship_ambient.ogg" type="audio/ogg">
    </audio>

    <div class="container">
        <div class="status-text">⚡ WILL BE IN SOON ⚡</div>
        
        <div class="countdown-grid">
            <div class="time-box">
                <span class="number" id="days">00</span>
                <span class="label">Days ⏳</span>
            </div>
            <div class="time-box">
                <span class="number" id="hours">00</span>
                <span class="label">Hours 🪐</span>
            </div>
            <div class="time-box">
                <span class="number" id="minutes">00</span>
                <span class="label">Mins 🛸</span>
            </div>
            <div class="time-box">
                <span class="number" id="seconds">00</span>
                <span class="label">Secs ⚡</span>
            </div>
        </div>

        <a href="#" class="back-btn">&larr; Go Back to Home</a>
    </div>

    <script>
        // Target launch timestamp setting
        const targetDate = new Date("January 30, 2027 00:00:00").getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const difference = targetDate - now;

            if (difference <= 0) {
                clearInterval(timerInterval);
                document.querySelector(".countdown-grid").innerHTML = "<h2 style='color:var(--neon-green); font-size: 2rem;'>SYSTEM ONLINE</h2>";
                return;
            }

            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((difference % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = days.toString().padStart(2, '0');
            document.getElementById("hours").innerText = hours.toString().padStart(2, '0');
            document.getElementById("minutes").innerText = minutes.toString().padStart(2, '0');
            document.getElementById("seconds").innerText = seconds.toString().padStart(2, '0');
        }

        updateCountdown();
        const timerInterval = setInterval(updateCountdown, 1000);

        // Audio Activation Script
        const music = document.getElementById('bg-music');
        const overlay = document.getElementById('audio-click-overlay');

        window.addEventListener('DOMContentLoaded', () => {
            music.volume = 0.5;
            music.play().catch(() => {});
        });

        document.addEventListener('click', () => {
            if (music.muted) {
                music.muted = false; 
                music.play().catch(() => {});
                
                overlay.style.opacity = '0';
                setTimeout(() => {
                    overlay.style.visibility = 'hidden';
                }, 600);
            }
        });

        // Plexus Constellation Effect Script
        const canvas = document.getElementById('plexusCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const config = {
            particleCount: 45,
            maxDistance: 250,
            dotColor: 'rgba(0, 240, 255, 0.9)',
            lineColor: 'rgba(0, 200, 220, 0.15)',
            glowColor: 'rgba(0, 240, 255, 0.4)',
            bgGradientStart: '#02131a',
            bgGradientEnd: '#03080c'
        };

        const particles = [];

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 0.4;
                this.vy = (Math.random() - 0.5) * 0.4;
                this.radius = Math.random() * 2.5 + 1;
                this.alpha = Math.random() * 0.5 + 0.5;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                if (this.x < 0) this.x = canvas.width;
                if (this.x > canvas.width) this.x = 0;
                if (this.y < 0) this.y = canvas.height;
                if (this.y > canvas.height) this.y = 0;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = config.dotColor;
                
                if(this.radius > 2.5) {
                    ctx.shadowBlur = 12;
                    ctx.shadowColor = config.glowColor;
                } else {
                    ctx.shadowBlur = 0;
                }
                
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        function initParticles() {
            particles.length = 0;
            for (let i = 0; i < config.particleCount; i++) {
                particles.push(new Particle());
            }
        }

        function drawLines() {
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < config.maxDistance) {
                        const opacity = (1 - (distance / config.maxDistance)) * 0.25;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = `rgba(0, 220, 240, ${opacity})`;
                        ctx.lineWidth = 0.8;
                        ctx.stroke();
                    }
                }
            }
        }

        function animate() {
            const gradient = ctx.createRadialGradient(canvas.width/2, canvas.height/2, 10, canvas.width/2, canvas.height/2, canvas.width);
            gradient.addColorStop(0, config.bgGradientStart);
            gradient.addColorStop(1, config.bgGradientEnd);
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            drawLines();
            
            particles.forEach(particle => {
                particle.update();
                particle.draw();
            });

            requestAnimationFrame(animate);
        }

        initParticles();
        animate();
    </script>
</body>
</html>
